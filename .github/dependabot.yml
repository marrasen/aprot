version: 2
updates:
  # Go modules — all five in one entry, so a minor/patch bump lands as a single
  # PR that moves every module together.
  #
  # They cannot be updated independently. example/vanilla, example/react,
  # example/task-middleware and e2e all `replace` the root module, so they carry
  # the root's dependencies as *indirect* requirements pinned in their own
  # go.mod. Two consequences:
  #
  #   - One entry per module raised one PR per module. Merging the root's PR on
  #     its own left the other four stale, and `go run` in them fails with
  #     "updates to go.mod needed" — that is what broke #366.
  #   - `allow: dependency-type: all` is required. The default is direct
  #     dependencies only, and for the four siblings every one of these is
  #     indirect, so the default meant they were never offered an update at all.
  #
  # The go-fmt job re-runs `go mod tidy` in all four siblings and fails on a
  # diff, so a bump that still arrives split gets a message naming the cause
  # rather than three unrelated-looking job failures. Majors are raised
  # individually so they can be reviewed on their own.
  - package-ecosystem: gomod
    directories:
      - /
      - /example/vanilla
      - /example/react
      - /example/task-middleware
      - /e2e
    schedule:
      interval: weekly
    allow:
      - dependency-type: all
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  # GitHub Actions used by the CI workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # npm packages for the example/e2e clients (only directories with a lockfile).
  #
  # The three TypeScript-consuming projects sit on different major versions
  # (vanilla 5.x, e2e 6.x, react client 7.x). Generated clients are the
  # library's public surface, so compiling them across three majors is the only
  # signal we have that codegen output works for consumers on older toolchains.
  # The vanilla client is pinned to 5.x by hand to hold the low end of that
  # range; e2e and the react client still take TypeScript majors from Dependabot.
  - package-ecosystem: npm
    directory: /example/vanilla/client
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /example/react/client
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
