name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  go-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # go.mod asks for 1.26 without a patch, so without this the runner's
          # preinstalled 1.26.x is used and stays behind. govulncheck gates on
          # standard library advisories, which are fixed in patch releases, so
          # the gate is only meaningful on the newest one.
          check-latest: true

      - name: Run Go tests
        run: go test -race -v ./...

  go-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # go.mod asks for 1.26 without a patch, so without this the runner's
          # preinstalled 1.26.x is used and stays behind. govulncheck gates on
          # standard library advisories, which are fixed in patch releases, so
          # the gate is only meaningful on the newest one.
          check-latest: true

      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"

  go-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # go.mod asks for 1.26 without a patch, so without this the runner's
          # preinstalled 1.26.x is used and stays behind. govulncheck gates on
          # standard library advisories, which are fixed in patch releases, so
          # the gate is only meaningful on the newest one.
          check-latest: true

      - name: Lint root module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          working-directory: .

      - name: Lint example/vanilla module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          working-directory: example/vanilla

      - name: Lint example/react module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          working-directory: example/react

      - name: Lint e2e module
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10
          working-directory: e2e

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # go.mod asks for 1.26 without a patch, so without this the runner's
          # preinstalled 1.26.x is used and stays behind. govulncheck gates on
          # standard library advisories, which are fixed in patch releases, so
          # the gate is only meaningful on the newest one.
          check-latest: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  gosec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # go.mod asks for 1.26 without a patch, so without this the runner's
          # preinstalled 1.26.x is used and stays behind. govulncheck gates on
          # standard library advisories, which are fixed in patch releases, so
          # the gate is only meaningful on the newest one.
          check-latest: true

      - name: Run gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...

  typescript-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # go.mod asks for 1.26 without a patch, so without this the runner's
          # preinstalled 1.26.x is used and stays behind. govulncheck gates on
          # standard library advisories, which are fixed in patch releases, so
          # the gate is only meaningful on the newest one.
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate vanilla client
        run: cd example/vanilla/tools/generate && go run main.go

      - name: Generate react client
        run: cd example/react/tools/generate && go run main.go

      # The steps above regenerate the example clients, so everything below
      # validates what the generator produces right now — nothing compares it
      # against what is committed. The committed output is documentation (the
      # README points readers at it) and it is the only artifact showing what a
      # template change does, so it has to match. #304 changed a template
      # without regenerating and CI stayed green through 296 lines of drift.
      - name: Check generated clients are up to date
        run: |
          # Intent-to-add so a generated file that was never committed shows up
          # as a diff instead of passing as an untracked file.
          git add -AN example/vanilla/client/static/api example/react/client/src/api
          git diff --exit-code -- example/vanilla/client/static/api example/react/client/src/api \
            || { echo "::error::Generated clients are stale — run the generators (see CLAUDE.md) and commit the result"; exit 1; }

      - name: Install vanilla example deps
        run: cd example/vanilla/client && npm ci

      - name: Check vanilla client compiles
        run: cd example/vanilla/client && npx tsc --noEmit

      - name: Lint vanilla client
        run: cd example/vanilla/client && npm run lint

      - name: Install react example deps
        run: cd example/react/client && npm ci

      - name: Check react client compiles
        run: cd example/react/client && npx tsc --noEmit

      # Compiles the generated output of every mode (single-file and
      # multi-file, vanilla and React). Skips itself unless the React
      # example's node_modules is present, which the step above installs.
      - name: Typecheck generated clients (all output modes)
        run: go test -run TestGeneratedClientsTypecheck -v .

      - name: Lint react client
        run: cd example/react/client && npm run lint

  e2e-tests:
    runs-on: ubuntu-latest
    needs: go-tests
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # go.mod asks for 1.26 without a patch, so without this the runner's
          # preinstalled 1.26.x is used and stays behind. govulncheck gates on
          # standard library advisories, which are fixed in patch releases, so
          # the gate is only meaningful on the newest one.
          check-latest: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Generate E2E client
        run: cd e2e/generate && go run main.go

      - name: Install E2E deps
        run: cd e2e && npm ci

      - name: Lint E2E tests
        run: cd e2e && npm run lint

      - name: Run E2E tests
        run: cd e2e && npm test
